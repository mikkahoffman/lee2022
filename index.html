<!DOCTYPE html>
<html>
<head>
  <title>lee&gelman2022 replication</title>
  <script src="https://unpkg.com/jspsych@8.0.0"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.0.0"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.0.0"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.0.0"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-text@2.1.1"></script> 
<link rel="stylesheet" href="https://unpkg.com/@jspsych/plugin-survey@4.0.0/css/survey.min.css">
  <!-- the DataPipe extension, which saves our data -->
  <script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>
  <link href="https://unpkg.com/jspsych@8.0.0/css/jspsych.css" rel="stylesheet" type="text/css" />
</head>

<body></body>
<script>

// This code is written by Mikka Hoffman with assistance from Claude (Sonnet 5.5) and Gemini (via Google search). Code has also been adapted from tutorials by Bria Long and Martin Zettersten. 

  // initialize jsPsych
  var jsPsych = initJsPsych({
    // send the data to DataPipe - copied from Bria Long's tutorial
    extensions: [
      {
        type: jsPsychExtensionPipe,
        params: {
          experiment_id: "9VisdyYm0Nf0",
          filename: function () {
            return subject_id + ".csv";
          }
        }
      }
    ],
    //redirect to SONA on finish
    on_finish: function(){
    window.location = "https://ucsd.sona-systems.com/webstudy_credit.aspx?experiment_id=3177&credit_token=cc7f42facbb7431191ebe7f526e7f220&survey_code="+id;
  }
  });

  //get SONA ID
var id = jsPsych.data.getURLVariable('id');

  // give each participant a random ID. Their data file is named after it.
  var subject_id = jsPsych.randomization.randomID(10);

  // create timeline
  var timeline = [];

  // define consent form block 
var consent = {
    type: jsPsychHtmlButtonResponse,
    data: { item_id: 'consent' },
    stimulus: `
    <div style="max-width: 600px; margin: 0 auto; text-align: left;">
      <h2>Consent for Participation in a Research Study</h2>
      <p>You are being invited to participate in a research study titled "Reproducibility of Psychological Science and Instruction." This study is being done by Dr. Bria Long from UC San Diego and associated graduate students in Experimental Methods course. You were selected to participate in this study because you are an adult in the U.S. and have been a represented population in previous psychology studies.</p>
      <p>The purpose of this study is to better understand how well previously published studies in the psychological field replicate online and with different populations. Your participation in this research should last approximately 5-30 minutes  If you agree to take part in this study, you may be asked to view a set of stimuli, including pictures, sounds, written text, or videos and then giving some responses via key-presses, verbally, or with paper-and-pencil. We may also observe your choices or preferences among an array of stimuli.  These stimuli will be taken directly from or closely adapted from studies that already exist in the published psychological literature. Stimuli will include, e.g., pictures of objects and human faces, audio and video clips, short text passages, etc. None of the stimuli will be disturbing, threatening, or offensive. The online and in-person experiments described in this protocol will take no more than 30 minutes. An example game you might play would be to click on an image on the screen that matches a word you hear being said out loud. Your total expected time commitment for this study is between 5-30 minutes, and is specified in the study description.</p>
      <p>Your participation in this study is completely voluntary and you can withdraw at any time. Choosing not to participate or withdrawing will result in no penalty or loss of benefits to which you are entitled. You are free to skip any question that you choose.</p>
      <p>We will not be asking for any personally identifying information, and we will handle responses as confidentially as possible. Your SONA or Prolific IDs will never be tied to your responses on this survey. However, we cannot guarantee the confidentiality of information transmitted over the Internet. To minimize this risk, data containing anything that might be personally identifiable (e.g. Prolific IDs or IP addresses) will be encrypted on transfer and storage and will only be accessible to qualified lab personnel. We will be keeping data collected as part of this experiment indefinitely. This anonymized data (containing neither Prolific IDs nor IP addresses) may be shared with the scientific community or with other participants to be used as stimuli in future studies.</p>
      <p>If you have questions about this project or if you have a research-related problem, you may contact the researcher(s), Mikka Hoffman (m5hoffman@ucsd.edu) or Dr. Bria Long (brlong@ucsd.edu). If you have any questions concerning your rights as a research subject, you may contact the UC San Diego Office of IRB Administration at irb@ucsd.edu or 858-246-4777.</p>
      <p>By participating in this research you are indicating that you are at least 18 years old, have read this consent form, and agree to participate in this research study. Please keep this consent form for your records.</p>
    </div>
    `,
    choices: ['I agree', 'I do not agree']
  };
  timeline.push(consent);

  // Define an exit node if they choose 'I do not agree' (suggested by Gemini)
var exit_node = {
  timeline: [{
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<p>You did not consent to participate. You can now close this window. Thank you!</p>',
    choices: "NO_KEYS" // Prevents them from proceeding further
  }],
  conditional_function: function(){
    // Get data from the last trial (the consent trial)
    var last_trial_data = jsPsych.data.get().last(1).values()[0];
    // 'I do not agree' is the second button, which corresponds to response index 1
    if(last_trial_data.response === 1){
      return true; // Run the exit timeline
    } else {
      return false; // Skip the exit timeline and continue the experiment
    }
  }
};
timeline.push(exit_node);

  // define the instructions trial
  var instructions = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <p>You will read short stories and will be asked what you think about the behaviors of the characters in the stories.</p>
      <p>Press any key to begin.</p>
    `
  };
  timeline.push(instructions);

  // Define questions items
var question_items = [
  { id: 'book_digital', prompt: '<p>Jordan finds that an e-book was saved on a shared computer in the room.<br>Jordan is the only person in the room.<br>No one will know if Jordan downloads the e-book on his laptop.<br><br>Is it okay or not okay for Jordan to download the e-book?<br>How okay or not okay is it?</p>' },
  { id: 'photo_digital', prompt: '<p>Peyton finds that a photo of nature was saved on a shared computer in the room.<br>Peyton is the only person in the room.<br>No one will know if Peyton downloads the photo on his laptop.<br><br>Is it okay or not okay for Peyton to download the photo?<br>How okay or not okay is it?</p>' },
  { id: 'game_digital', prompt: '<p>Robin finds that a fishing game was saved on a shared computer in the room.<br>Robin is the only person in the room.<br>No one will know if Robin downloads the fishing game on her laptop.<br><br>Is it okay or not okay for Robin to download the fishing game?<br>How okay or not okay is it?</p>' },
  { id: 'music_digital', prompt: '<p>Jesse finds that a music file was saved on a shared computer in the room.<br>Jesse is the only person in the room.<br>No one will know if Jesse downloads the music file on her laptop.<br><br>Is it okay or not okay for Jesse to download the music file?<br>How okay or not okay is it?</p>' },
  { id: 'movie_digital', prompt: '<p>Sammy finds that a movie file was saved on a shared computer in the room.<br>Sammy is the only person in the room.<br>No one will know if Sammy downloads the movie file on his laptop.<br><br>Is it okay or not okay for Sammy to download the movie file?<br>How okay or not okay is it?</p>' },
  { id: 'drawing_digital', prompt: '<p>Blake finds that a drawing was saved on a shared computer in the room.<br>Blake is the only person in the room.<br>No one will know if Blake downloads the drawing to her laptop.<br><br>Is it okay or not okay for Blake to download the drawing?<br>How okay or not okay is it?</p>' },
  { id: 'drawing_nondigital', prompt: '<p>Blake finds that a drawing on a page from a sketchbook was left next to a shared computer in the room.<br>Blake is the only person in the room.<br>No one will know if Blake takes the drawing with her.<br><br>Is it okay or not okay for Blake to take the drawing?<br>How okay or not okay is it?</p>' },
  { id: 'music_nondigital', prompt: '<p>Jesse finds that a music CD was left next to a shared computer in the room.<br>Jesse is the only person in the room.<br>No one will know if Jesse takes the music CD with her.<br><br>Is it okay or not okay for Jesse to take the music CD?<br>How okay or not okay is it?</p>' },
  { id: 'movie_nondigital', prompt: '<p>Sammy finds that a videotape of a movie was left next to a shared computer in the room.<br>Sammy is the only person in the room.<br>No one will know if Sammy takes the videotape with him.<br><br>Is it okay or not okay for Sammy to take the videotape?<br>How okay or not okay is it?</p>' },
  { id: 'book_nondigital', prompt: '<p>Jordan finds that a book was left next to a shared computer in the room.<br>Jordan is the only person in the room.<br>No one will know if Jordan takes the book with him.<br><br>Is it okay or not okay for Jordan to take the book?<br>How okay or not okay is it?</p>' },
  { id: 'photo_nondigital', prompt: '<p>Peyton finds that a photo of nature was left next to a shared computer in the room.<br>Peyton is the only person in the room.<br>No one will know if Peyton puts the photo in his bag.<br><br>Is it okay or not okay for Peyton to put the photo in his bag?<br>How okay or not okay is it?</p>' },
  { id: 'game_nondigital', prompt: '<p>Robin finds that a plastic fishing game was left next to a shared computer in the room.<br>Robin is the only person in the room.<br>No one will know if Robin takes the plastic fishing game with her.<br><br>Is it okay or not okay for Robin to take the plastic fishing game?<br>How okay or not okay is it?</p>' }
];

// Define conditions
 var conditions = {
    condition_1: ['book_digital','movie_nondigital','photo_digital','drawing_nondigital','game_digital','music_nondigital'],
    condition_2: ['book_nondigital','movie_digital','photo_nondigital','drawing_digital','game_nondigital','music_digital'],
    condition_3: ['book_digital','movie_digital','photo_digital','drawing_nondigital','game_nondigital','music_nondigital'],
    condition_4: ['book_nondigital','movie_nondigital','photo_nondigital','drawing_digital','game_digital','music_digital'],
    condition_5: ['book_digital','movie_digital','photo_nondigital','drawing_nondigital','game_digital','music_nondigital'],
    condition_6: ['book_nondigital','movie_nondigital','photo_digital','drawing_digital','game_nondigital','music_digital']
  };

 // Assistance came from Claude (Sonnet 5.5) to help with condition definition, assignment, and randomization using the prompt "I'm trying to build a jspsych experiment that has 12 items - each participant sees 6 items using a pre-determined counterbalancing scheme. Those 6 items are randomly presented. This is what I have so far. Tell me why it isn't working and how to fix it to match my goals"
 // only some suggestions were implemented, including the condition assignment, randomization and trial presentation below. This code was also repurposed for the experimental vignette trials. 
 

 //assign a condition randomly
 var condition_assignment = jsPsych.randomization.sampleWithoutReplacement(Object.keys(conditions), 1)[0];
  console.log(condition_assignment);
  jsPsych.data.addProperties({ subject_id: subject_id, condition: condition_assignment });

  // look up this participant's 6 items, then randomize their order (claude helped here)
  var shuffledQuestions = jsPsych.randomization.shuffle(
    conditions[condition_assignment].map(function (id) {
      return question_items.find(function (q) { return q.id === id; });
    })
  );

  // build one trial per item (claude helped here)
  var trials = shuffledQuestions.map(function (item) {
    return {
      type: jsPsychSurveyHtmlForm,
      data: {
        item_id: item.id,
        format_type: item.id.split('_')[1], // format
        item: item.id.split('_')[0], // item
      },
      preamble: `
        <style>
          .preamble { font-size: 18px; line-height: 1.5; text-align: center;
                      max-width: 100%; margin: 40px auto; padding: 20px; }
        </style>
        <div class="preamble"><p>${item.prompt}</p></div>`,
      html: `
        <style>
          .likert-container { display: flex; justify-content: space-between; align-items: center;
                              max-width: 600px; margin: 30px auto; }
          .likert-option { display: flex; flex-direction: column; align-items: center;
                           cursor: pointer; width: 80px; }
          .likert-option input { margin-bottom: 8px; cursor: pointer; }
          .likert-label { font-size: 14px; text-align: center; line-height: 1.2; }
        </style>
        <div class="likert-container">
          <label class="likert-option"><input type="radio" name="okayness" value="-2" required /><span class="likert-label">Totally not okay</span></label>
          <label class="likert-option"><input type="radio" name="okayness" value="-1" required /><span class="likert-label">Not okay</span></label>
          <label class="likert-option"><input type="radio" name="okayness" value="0" required /><span class="likert-label">Neutral</span></label>
          <label class="likert-option"><input type="radio" name="okayness" value="1" required /><span class="likert-label">Okay</span></label>
          <label class="likert-option"><input type="radio" name="okayness" value="2" required /><span class="likert-label">Totally okay</span></label>
        </div>
        <div>
          <label for="open_response">What made you think so? Describe your reason below.</label><br>
          <textarea id="open_response" name="open_response" rows="3" cols="40" required></textarea>
        </div>`,
      button_label: 'Next',
      on_finish: function(data) {
        //separate responses into rating and open response
    data.rating = data.response.okayness;
    data.justification = data.response.open_response;
  }
    };
  });

  timeline.push(...trials);

  //attention check
  var attention_check = {
    type: jsPsychSurveyHtmlForm,
    data: { item_id: 'attention_check' },
    preamble: `
      <style>
        .preamble { font-size: 18px; line-height: 1.5; text-align: center;
                    max-width: 100%; margin: 40px auto; padding: 20px; }
      </style>
      <div class="preamble"><p>To make sure you are paying attention, please select "Okay" for this question.</p></div>`,
    html: `
      <style>
        .likert-container { display: flex; justify-content: space-between; align-items: center;
                            max-width: 600px; margin: 30px auto; }
        .likert-option { display: flex; flex-direction: column; align-items: center;
                         cursor: pointer; width: 80px; }
        .likert-option input { margin-bottom: 8px; cursor: pointer; }
        .likert-label { font-size: 14px; text-align: center; line-height: 1.2; }
      </style>
      <div class="likert-container">
        <label class="likert-option"><input type="radio" name="attention_check" value="-2" required /><span class="likert-label">Totally not okay</span></label>
        <label class="likert-option"><input type="radio" name="attention_check" value="-1" required /><span class="likert-label">Not okay</span></label>
        <label class="likert-option"><input type="radio" name="attention_check" value="0" required /><span class="likert-label">Neutral</span></label>
        <label class="likert-option"><input type="radio" name="attention_check" value="1" required /><span class="likert-label">Okay</span></label>
        <label class="likert-option"><input type="radio" name="attention_check" value="2" required /><span class="likert-label">Totally okay</span></label>
      </div>`,
    button_label: 'Next',
    on_finish: function(data) {
      data.attention_check_response = data.response.attention_check;
    }
  };
  timeline.push(attention_check);
  
  //add in exploratory vignettes - randomize order of the four new vignettes (2 digital, 2 nondigital, counterbalance)
  var exploratory_stimuli = [
    { id: 'kidphoto_digital', prompt: '<p>Theo finds that a photo of a child was saved on a shared computer in the room.<br>Theo is the only person in the room.<br>No one will know if Theo downloads the photo on his laptop.<br><br>Is it okay or not okay for Theo to download the photo?<br>How okay or not okay is it?</p>' },
    { id: 'adultphoto_digital', prompt: '<p>Charlie finds that a photo of an adult was saved on a shared computer in the room.<br>Charlie is the only person in the room.<br>No one will know if Charlie downloads the photo on his laptop.<br><br>Is it okay or not okay for Charlie to download the photo?<br>How okay or not okay is it?</p>' },
    { id: 'kidphoto_nondigital', prompt: '<p>Theo finds that a photo of a child was left next to a shared computer in the room.<br>Theo is the only person in the room.<br>No one will know if Theo puts the photo in his bag.<br><br>Is it okay or not okay for Theo to put the photo in his bag?<br>How okay or not okay is it?</p>' },
    { id: 'adultphoto_nondigital', prompt: '<p>Charlie finds that a photo of an adult was left next to a shared computer in the room.<br>Charlie is the only person in the room.<br>No one will know if Charlie puts the photo in his bag.<br><br>Is it okay or not okay for Charlie to put the photo in his bag?<br>How okay or not okay is it?</p>' }
  ];

// Define conditions
 var exploratory_conditions = {
    expl_condition_1: ['kidphoto_digital','adultphoto_nondigital'],
    expl_condition_2: ['kidphoto_nondigital','adultphoto_digital'],
  };

 //assign a condition randomly
 var exploratory_condition_assignment = jsPsych.randomization.sampleWithoutReplacement(Object.keys(exploratory_conditions), 1)[0];
  console.log(exploratory_condition_assignment);
  jsPsych.data.addProperties({ subject_id: subject_id, expl_condition: exploratory_condition_assignment });


  // look up this participant's 2 items, then randomize their order
  var exploratory_shuffledQuestions = jsPsych.randomization.shuffle(
    exploratory_conditions[exploratory_condition_assignment].map(function (id) {
      return exploratory_stimuli.find(function (q) { return q.id === id; });
    })
  );

  // build one trial per item
  var exploratory_trials = exploratory_shuffledQuestions.map(function (item) {
    return {
      type: jsPsychSurveyHtmlForm,
      data: {
        item_id: item.id,
        format_type: item.id.split('_')[1], // format
        item: item.id.split('_')[0], // item
      },
      preamble: `
        <style>
          .preamble { font-size: 18px; line-height: 1.5; text-align: center;
                      max-width: 100%; margin: 40px auto; padding: 20px; }
        </style>
        <div class="preamble"><p>${item.prompt}</p></div>`,
      html: `
        <style>
          .likert-container { display: flex; justify-content: space-between; align-items: center;
                              max-width: 600px; margin: 30px auto; }
          .likert-option { display: flex; flex-direction: column; align-items: center;
                           cursor: pointer; width: 80px; }
          .likert-option input { margin-bottom: 8px; cursor: pointer; }
          .likert-label { font-size: 14px; text-align: center; line-height: 1.2; }
        </style>
        <div class="likert-container">
          <label class="likert-option"><input type="radio" name="okayness" value="-2" required /><span class="likert-label">Totally not okay</span></label>
          <label class="likert-option"><input type="radio" name="okayness" value="-1" required /><span class="likert-label">Not okay</span></label>
          <label class="likert-option"><input type="radio" name="okayness" value="0" required /><span class="likert-label">Neutral</span></label>
          <label class="likert-option"><input type="radio" name="okayness" value="1" required /><span class="likert-label">Okay</span></label>
          <label class="likert-option"><input type="radio" name="okayness" value="2" required /><span class="likert-label">Totally okay</span></label>
        </div>
        <div>
          <label for="open_response">What made you think so? Describe your reason below.</label><br>
          <textarea id="open_response" name="open_response" rows="3" cols="40" required></textarea>
        </div>`,
      button_label: 'Next',
      on_finish: function(data) {
        //separate responses into rating and open response
    data.rating = data.response.okayness;
    data.justification = data.response.open_response;
    }
  }
});

  timeline.push(exploratory_trials);

  // AI honesty check
  var honesty_check = {
    type: jsPsychSurveyHtmlForm,
    data: { item_id: 'honesty_check' },
    preamble: `
      <style>
        .preamble { font-size: 18px; line-height: 1.5; text-align: center;
                    max-width: 100%; margin: 40px auto; padding: 20px; }
      </style>
      <div class="preamble"><p>We want to make sure that you are answering honestly. Please answer the following question truthfully. Your answer will not impact your ability to receive credit for this study.</p></div>`,
    html: `
      <label for="honesty_response">Did you use AI tools (like ChatGPT) to help you answer questions in this study at any point?</label><br>
      <select id="honesty_response" name="honesty_response" required>
        <option value="">Select an option</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>`,
    button_label: 'Next',
    on_finish: function(data) {
      data.honesty_response = data.response.honesty_response;
    }
  };
  timeline.push(honesty_check);

  // define debrief trial
  var debrief = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div style="max-width: 600px; margin: 0 auto; text-align: left;">
      <h1>Thank you for participating in this study!</h1>
      <p> You participated in a study that replicated a psychological study exploring adults' moral judgments regarding ownership over digital properties.</p>
       <p>Why are we interested in this? Digital properties are prevalent in every day of our life.</p>
    <p> Traditional ownership involves ones right to use tangible properties in an exclusive manner. Recently, the notion of ownership has been extended to intangible entities in the digital world where creators have ownership over digital properties such as music, movies, video games, and software. </p>
    <p>However, not everyone grasps ownership over digital properties (i.e., digital copyrights). For instance, people commonly distribute or consume digital properties without permission. It is likely that adults do not treat the violation of digital ownership as serious as the violation of traditional ownership.</p> 
    <p> This study is designed to explore how adults and children evaluate the violation of digital ownership. </p>
    <p>We hope that this research will lead to a greater understanding of how people reason about digital properties and how their understanding of ownership over digital properties develops. Eventually, knowing more about this may impact how we talk about the right way to create and consume intellectual properties in the digital world.</p>
    <p> If you have any questions about this study, please feel free to contact the research team: Mikka Hoffman (m5hoffman@ucsd.edu) or Dr. Bria Long (brlong@ucsd.edu). If you have questions about your rights as a research subject, you may contact the UC San Diego Office of IRB Administration at IRB@ucsd.edu. </p>
    <p>Thank you for your time and participation!</p>
      <p>Press any key to complete the experiment.</p>
    </div>
    `
  };
  timeline.push(debrief);

 // start the experiment
 jsPsych.run(timeline);

 </script>
</html>
